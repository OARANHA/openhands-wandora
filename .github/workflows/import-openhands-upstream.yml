name: Import OpenHands upstream into a review branch

# Manual gate: a fine-grained GitHub PAT with Contents (read/write) and
# Workflows (read/write) scoped to this repository is required.
# GITHUB_TOKEN (GitHub App) cannot push upstream .github/workflows files.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-openhands-upstream
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'OARANHA/openhands-wandora'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify the limited import credential is configured
        env:
          IMPORT_TOKEN: ${{ secrets.OPENHANDS_IMPORT_TOKEN }}
        shell: bash
        run: |
          if [ -z "${IMPORT_TOKEN}" ]; then
            echo "::error::Add repository secret OPENHANDS_IMPORT_TOKEN with Contents and Workflows write permissions, then dispatch this workflow manually."
            exit 1
          fi

      - name: Checkout bootstrap repository with authorized token
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.OPENHANDS_IMPORT_TOKEN }}
          persist-credentials: true

      - name: Import pinned upstream history to an isolated branch
        env:
          UPSTREAM_SHA: e0a26af82f0b2016423c0d53cc9ae32a357cef2d
          IMPORT_BRANCH: import/openhands-upstream
        shell: bash
        run: |
          set -euo pipefail

          test "$(git branch --show-current)" = main
          if git ls-remote --exit-code --heads origin "refs/heads/${IMPORT_BRANCH}" > /dev/null; then
            echo "::notice::Import branch already exists; leaving it unchanged"
            exit 0
          fi

          git remote add upstream https://github.com/OpenHands/OpenHands.git
          git fetch --no-tags upstream "${UPSTREAM_SHA}"
          test "$(git rev-parse FETCH_HEAD)" = "${UPSTREAM_SHA}"

          git switch --create "${IMPORT_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the complete upstream Git ancestry, including workflows.
          # Merge the bootstrap history only into this review branch.
          git merge --no-ff --no-edit --allow-unrelated-histories FETCH_HEAD \
            -m "chore: import OpenHands history at ${UPSTREAM_SHA}" > /dev/null

          test -f LICENSE
          git push origin "HEAD:refs/heads/${IMPORT_BRANCH}"

      - name: Publish summary
        if: success()
        run: |
          echo "Imported upstream into import/openhands-upstream for PR review." >> "$GITHUB_STEP_SUMMARY"
          echo "No merge to main and no deployment were performed." >> "$GITHUB_STEP_SUMMARY"
